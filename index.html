<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Multiplicação Rubro-Negro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Jogo da Tabuada</h1>
            <p class="subtitle">Mente Rubro-Negra</p>
        </header>

        <div class="score-board">
            <span>Pontuação: <strong id="score">0</strong></span>
        </div>

        <main class="game-area">
            <!-- Exibição do desafio (Ex: ? x 6 = 42) -->
            <div class="challenge-box" id="challenge">
                ? x 0 = 0
            </div>

            <label for="userGuess">Qual é o número secreto?</label>
            <input type="number" id="userGuess" min="1" max="10" placeholder="1 a 10">
            <button id="btnChutar" onclick="validarResposta()">Chutar!</button>
            
            <div id="result" class="result-box"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
